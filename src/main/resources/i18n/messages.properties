# Bean Validation templates. Named parameters are interpolated by the validator.
jakarta.validation.constraints.NotBlank.message=不能为空或仅包含空白字符
jakarta.validation.constraints.NotNull.message=不能为 null
jakarta.validation.constraints.Size.message=长度或数量必须在 {min} 到 {max} 之间
jakarta.validation.constraints.PositiveOrZero.message=必须大于或等于 0
jakarta.validation.constraints.DecimalMin.message=必须大于${inclusive == true ? '或等于' : ''} {value}
jakarta.validation.constraints.Digits.message=整数最多 {integer} 位，小数最多 {fraction} 位

cloud {
  projection.enabled = true
  projection.slice-ranges = 4
  scheduler {
    candidate-query-limit = 100
    max-claim-attempts = 10
    ask-timeout = 3s
  }
  reservation {
    # Must normally cover the complete Nova provisioning/confirmation window.
    ttl = 12m
    # Idempotency history; confirmed outcomes are retained while allocations exist.
    outcome-retention = 24h
    outcome-cleanup-interval = 10m
  }
  instance {
    ask-timeout = 3s
    provisioning-timeout = 10m
    poll {
      initial-delay = 2s
      max-delay = 10s
    }
  }
  database {
    host = "localhost"
    host = ${?DB_HOST}
    port = 3306
    port = ${?DB_PORT}
    name = "arc_reactor"
    name = ${?DB_NAME}
    url = "jdbc:mysql://localhost:3306/arc_reactor"
    url = ${?DATABASE_URL}
    user = "root"
    user = ${?DATABASE_USER}
    password = "123456"
    password = ${?DATABASE_PASSWORD}
    maximum-pool-size = 10
  }
}

pekko {
  actor {
    provider = cluster
    serialization-bindings {
      "cn.veryai.arcreactor.actor.hypervisor.command.HypervisorCommand" = jackson-cbor
      "cn.veryai.arcreactor.actor.hypervisor.event.HypervisorEvent" = jackson-cbor
      "cn.veryai.arcreactor.actor.hypervisor.model.HypervisorState" = jackson-cbor
    }
  }

  remote.artery {
    canonical.hostname = "127.0.0.1"
    canonical.hostname = ${?PEKKO_HOST}
    canonical.port = 25520
    canonical.port = ${?PEKKO_PORT}
  }

  cluster {
    seed-nodes = ["pekko://cloud-resource-manager@127.0.0.1:25520"]
    seed-nodes = ${?PEKKO_SEED_NODES}
    sharding {
      state-store-mode = ddata
      remember-entities = off
      remember-entities-store = eventsourced
      journal-plugin-id = "pekko.persistence.r2dbc.journal"
      snapshot-plugin-id = "pekko.persistence.r2dbc.snapshot"
    }
  }

  persistence {
    journal.plugin = "pekko.persistence.r2dbc.journal"
    snapshot-store.plugin = "pekko.persistence.r2dbc.snapshot"
    journal.auto-start-journals = ["pekko.persistence.r2dbc.journal"]
    snapshot-store.auto-start-snapshot-stores = ["pekko.persistence.r2dbc.snapshot"]
  }

  persistence.r2dbc {
    dialect = "mysql"
    journal.table = "pekko_event_journal"
    snapshot.table = "pekko_snapshot"
    connection-factory {
      driver = "mysql"
      host = ${cloud.database.host}
      port = ${cloud.database.port}
      database = ${cloud.database.name}
      user = ${cloud.database.user}
      password = ${cloud.database.password}
    }
    db-timestamp-monotonic-increasing = on
    use-app-timestamp = on
    journal.publish-events = on
    query.deduplicate-capacity = 5000
  }

  projection.jdbc {
    dialect = mysql-dialect
    blocking-jdbc-dispatcher.thread-pool-executor.fixed-pool-size = 10
    offset-store.use-lowercase-schema = true
  }
}

virtual-thread-dispatcher {
  type = Dispatcher
  executor = virtual-thread-executor
  throughput = 1
}

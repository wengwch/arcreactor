cloud {
  ask-timeout = 10s
  projection.enabled = true
  projection.slice-ranges = 4
  scheduler {
    candidate-query-limit = 100
    max-claim-attempts = 10
  }
  reservation {
    # Idempotency history; confirmed outcomes are retained while allocations exist.
    outcome-retention = 24h
    outcome-cleanup-interval = 10m
  }
  instance {
    reservation {
      # Retries after the initial reservation request; 0 disables retries.
      max-retries = 3
    }
    confirm {
      # Retries after the initial confirmation request; 0 disables retries.
      max-retries = 3
    }
    provisioning {
      # Total Nova/SSH checks, including the first check; must be positive.
      max-poll-attempts = 60
    }
    deletion {
      # Progress checks per deletion stage after its initial action; must be positive.
      max-poll-attempts = 60
    }
    poll {
      initial-delay = 5s
      max-delay = 15s
    }
  }
  user {
    share {
      poll-interval = 2s
    }
  }
  fip {
    # Idempotency window after all resources have been released.
    outcome-retention = 24h
    outcome-cleanup-interval = 10m
  }
  database {
    host = "localhost"
    host = ${?DB_HOST}
    port = 3306
    port = ${?DB_PORT}
    name = "arc_reactor"
    name = ${?DB_NAME}
    url = "jdbc:mysql://localhost:3306/arc_reactor"
    url = ${?DATABASE_URL}
    user = "root"
    user = ${?DATABASE_USER}
    password = "123456"
    password = ${?DATABASE_PASSWORD}
    maximum-pool-size = 10
  }
}

pekko {
  actor {
    provider = cluster
    serialization-bindings {
      "cn.veryai.arcreactor.actor.hypervisor.command.HypervisorCommand" = jackson-cbor
      "cn.veryai.arcreactor.actor.hypervisor.event.HypervisorEvent" = jackson-json
      "cn.veryai.arcreactor.actor.hypervisor.model.HypervisorState" = jackson-cbor
      "cn.veryai.arcreactor.actor.hypervisor.reply.ActionReply" = jackson-cbor
      "cn.veryai.arcreactor.actor.instance.command.WorkflowCommand" = jackson-cbor
      "cn.veryai.arcreactor.actor.instance.event.InstanceWorkflowEvent" = jackson-json
      "cn.veryai.arcreactor.actor.instance.model.InstanceWorkflowState" = jackson-cbor
      "cn.veryai.arcreactor.actor.instance.reply.InstanceReply" = jackson-cbor
      "cn.veryai.arcreactor.actor.instance.reply.InstanceMutationReply" = jackson-cbor
      "cn.veryai.arcreactor.actor.user.command.UserCommand" = jackson-cbor
      "cn.veryai.arcreactor.actor.user.event.UserEvent" = jackson-json
      "cn.veryai.arcreactor.actor.user.model.UserState" = jackson-cbor
      "cn.veryai.arcreactor.actor.user.reply.ShareReply" = jackson-cbor
      "cn.veryai.arcreactor.actor.user.reply.ProjectReply" = jackson-cbor
      "cn.veryai.arcreactor.actor.user.reply.NetworkReply" = jackson-cbor
      "cn.veryai.arcreactor.actor.fip.command.FloatingIpCommand" = jackson-cbor
      "cn.veryai.arcreactor.actor.fip.event.FloatingIpEvent" = jackson-json
      "cn.veryai.arcreactor.actor.fip.model.FloatingIpState" = jackson-cbor
      "cn.veryai.arcreactor.actor.fip.reply.ForwardingReply" = jackson-cbor
    }
  }

  serialization.jackson.jackson-json.compression.algorithm = off

  remote.artery {
    canonical.hostname = "127.0.0.1"
    canonical.hostname = ${?PEKKO_HOST}
    canonical.port = 25520
    canonical.port = ${?PEKKO_PORT}
  }

  cluster {
    seed-nodes = ["pekko://cloud-resource-manager@127.0.0.1:25520"]
    seed-nodes = ${?PEKKO_SEED_NODES}
    sharding {
      state-store-mode = ddata
      remember-entities = off
      remember-entities-store = eventsourced
      journal-plugin-id = "pekko.persistence.r2dbc.journal"
      snapshot-plugin-id = "pekko.persistence.r2dbc.snapshot"
    }
  }

  persistence {
    journal.plugin = "pekko.persistence.r2dbc.journal"
    snapshot-store.plugin = "pekko.persistence.r2dbc.snapshot"
    journal.auto-start-journals = ["pekko.persistence.r2dbc.journal"]
    snapshot-store.auto-start-snapshot-stores = ["pekko.persistence.r2dbc.snapshot"]
  }

  persistence.r2dbc {
    dialect = "mysql"
    journal.table = "pekko_event_journal"
    snapshot.table = "pekko_snapshot"
    connection-factory {
      driver = "mysql"
      host = ${cloud.database.host}
      port = ${cloud.database.port}
      database = ${cloud.database.name}
      user = ${cloud.database.user}
      password = ${cloud.database.password}
    }
    db-timestamp-monotonic-increasing = on
    use-app-timestamp = on
    journal.publish-events = on
    query.deduplicate-capacity = 5000
  }

  projection.jdbc {
    dialect = mysql-dialect
    blocking-jdbc-dispatcher.thread-pool-executor.fixed-pool-size = 10
    offset-store.use-lowercase-schema = true
  }
}

virtual-thread-dispatcher {
  type = Dispatcher
  executor = virtual-thread-executor
  throughput = 1
}

spring:
  application:
    name: arc-reactor
  main:
    web-application-type: servlet
    keep-alive: true
  mvc:
    async:
      request-timeout: "${INSTANCE_CREATE_REQUEST_TIMEOUT:11m}"
  web:
    locale: zh-CN
    locale-resolver: accept-header
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: "${DATABASE_URL:jdbc:mysql://localhost:3306/arc_reactor?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}"
    username: "${DATABASE_USER:root}"
    password: "${DATABASE_PASSWORD:123456}"
    hikari:
      pool-name: arc-reactor-mysql
      maximum-pool-size: "${DATABASE_POOL_SIZE:10}"
      auto-commit: false
  freemarker:
    suffix: .ftl
    charset: UTF-8
    settings:
      number_format: computer
      template_exception_handler: rethrow
      log_template_exceptions: false
mybatis:
  mapper-locations: "classpath*:/mapper/**/*.xml"
  configuration:
    map-underscore-to-camel-case: true
    default-executor-type: reuse

instance:
  creation:
    dependency-preparation-timeout: "${INSTANCE_DEPENDENCY_PREPARATION_TIMEOUT:10m}"
    dependency-poll-interval: "${INSTANCE_DEPENDENCY_POLL_INTERVAL:1s}"
    share-type: "${INSTANCE_SHARE_TYPE:cephfs-native}"
    share-size: "${INSTANCE_SHARE_SIZE:1}"
    network-cidr: "${INSTANCE_NETWORK_CIDR:10.0.0.0/16}"
    network-dns: "${INSTANCE_NETWORK_DNS:}"
    network-gateway: "${INSTANCE_NETWORK_GATEWAY:}"
    segmentation-id: "${INSTANCE_SEGMENTATION_ID:100}"
    parent-port-bandwidth-limit:
      max-kbps: "${INSTANCE_PARENT_PORT_MAX_KBPS:0}"
      max-burst-kbits: "${INSTANCE_PARENT_PORT_MAX_BURST_KBITS:0}"
    sub-port-bandwidth-limit:
      max-kbps: "${INSTANCE_SUB_PORT_MAX_KBPS:0}"
      max-burst-kbits: "${INSTANCE_SUB_PORT_MAX_BURST_KBITS:0}"
    ssh-username: "${INSTANCE_SSH_USERNAME:clouduser}"
    host-routes: {}

openstack:
  manila-fs-name: "${MANILA_FS_NAME:cephfs}"
  enabled: "${OPENSTACK_ENABLED:false}"
  default-cluster: "${OPENSTACK_DEFAULT_CLUSTER:default}"
  token-refresh-before-expiry: "${OPENSTACK_TOKEN_REFRESH_BEFORE_EXPIRY:PT10M}"
  member-role-id: "${OS_MEMBER_ROLE_ID:}"
  admin-role-id: "${OS_ADMIN_ROLE_ID:}"
  clusters:
    default:
      auth-url: "${OS_AUTH_URL:}"
      username: "${OS_USERNAME:}"
      password: "${OS_PASSWORD:}"
      user-domain-id: "${OS_USER_DOMAIN_ID:default}"
      default-project-id: "${OS_PROJECT_ID:}"
      default-region: "${OS_REGION_NAME:}"
      endpoint-interface: "${OS_INTERFACE:public}"
